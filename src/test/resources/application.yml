server:
  port: ${PORT:8080}
  ssl:
    enabled: false

spring:
  datasource:
    url: 'jdbc:hsqldb:mem:myDb;sql.syntax_pgs=true'
    username: sa
    password:
    driver-class-name: 'org.hsqldb.jdbc.JDBCDriver'
  flyway:
    enabled: false

management:
  endpoints:
    jmx:
      exposure:
        exclude: '*'
    web:
      base-path: '/'
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      # Publishes the liveness and readiness the contract requires, each also on its own path.
      probes:
        enabled: true
      # Serving depends on the datastore the keystores live in, so readiness weighs it.
      group:
        readiness:
          include: 'readinessState,db'
      status:
        order: 'DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN'
        http-mapping:
          DOWN: 503
          OUT_OF_SERVICE: 503
          DEGRADED: 200
          UNKNOWN: 200
  # Nothing is reported unless it is named here: an indicator's details can name a host or a path.
  health:
    defaults:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true

secrets:
  encryption:
    key: ${ENCRYPTION_KEY:tU)}u&N~B{sqQh{imRDl}

token:
  deleteOnRemove: ${TOKEN_DELETE_ON_REMOVE:false}

provider:
  cache:
    keystore:
      ttl-seconds: 60
      max-size: 500
    keydata:
      ttl-seconds: 300
      max-size: 10000
