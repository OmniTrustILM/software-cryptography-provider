server:
  port: ${PORT:8080}
  ssl:
    enabled: false

spring:
  datasource:
    url: 'jdbc:hsqldb:mem:myDb;sql.syntax_pgs=true'
    username: sa
    password:
    driver-class-name: 'org.hsqldb.jdbc.JDBCDriver'
  flyway:
    enabled: false

management:
  endpoints:
    jmx:
      exposure:
        exclude: '*'
    web:
      base-path: '/'
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # Serving depends on the datastore the keystores live in, so readiness weighs it. Adding the group leaves what
      # the health endpoint itself answers untouched.
      group:
        readiness:
          include: 'readinessState,db'

secrets:
  encryption:
    key: ${ENCRYPTION_KEY:tU)}u&N~B{sqQh{imRDl}

token:
  deleteOnRemove: ${TOKEN_DELETE_ON_REMOVE:false}

provider:
  cache:
    keystore:
      ttl-seconds: 60
      max-size: 500
    keydata:
      ttl-seconds: 300
      max-size: 10000
