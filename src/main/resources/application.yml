server:
  port: ${PORT:8080}
  ssl:
    enabled: false

spring:
  datasource:
    url: ${JDBC_URL}
    username: ${JDBC_USERNAME}
    password: ${JDBC_PASSWORD}
    driver-class-name: 'org.postgresql.Driver'
    auto-commit: false
  flyway:
    out-of-order: true
    table: "softcp_schema_history"
    schemas: ${DB_SCHEMA:softcp}
  jpa:
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:softcp}

management:
  endpoints:
    web:
      base-path: '/'
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      # Publishes the liveness and readiness the contract requires, each also on its own path.
      probes:
        enabled: true
      # Serving depends on the datastore the keystores live in, so readiness weighs it.
      group:
        readiness:
          include: 'readinessState,db'
      status:
        order: 'DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN'
        http-mapping:
          DOWN: 503
          OUT_OF_SERVICE: 503
          DEGRADED: 200
          UNKNOWN: 200
  # Nothing is reported unless it is named here: an indicator's details can name a host or a path.
  health:
    defaults:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true

secrets:
  encryption:
    key: ${ENCRYPTION_KEY:tU)}u&N~B{sqQh{imRDl}

token:
  deleteOnRemove: ${TOKEN_DELETE_ON_REMOVE:false}

provider:
  cache:
    # Caffeine cache for decrypted key material loaded from token-instance keystores.
    # Each entry holds the raw key bytes for one token instance UUID.
    keystore:
      # How long (in seconds) a keystore entry remains valid after it was last written.
      # After expiry, the next access reloads the keystore from the database.
      ttl-seconds: 60
      # Maximum number of token-instance keystores kept in memory simultaneously.
      max-size: 500
    # Caffeine cache for CachedKeyData DTOs read from the key_data table.
    # Each entry corresponds to one key UUID.
    keydata:
      # How long (in seconds) a key-data entry remains valid after it was last written.
      # After expiry, the next access reloads the row from the database.
      ttl-seconds: 300
      # Maximum number of key-data entries kept in memory simultaneously.
      max-size: 10000
