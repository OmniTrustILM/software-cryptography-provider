name: Test Docker image

on:
  pull_request:
    branches: [ main*, feat/*, hotfix/* ]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}-docker-test
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # The reusable workflow declares no secrets: it builds and scans locally and pushes
  # nothing, so none are passed.
  test:
    uses: OmniTrustILM/.github/.github/workflows/containers-test.yml@main
    with:
      image: ilm/software-cryptography-provider
      cache-scope: software-cryptography-provider
      # Check PR already runs the full suite on PRs to main, so these builds run only the image-smoke tests there.
      build-args: |
        VERSION=${{ github.ref_name }}
        MAVEN_TEST_GROUPS=${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'image-smoke' || '' }}
