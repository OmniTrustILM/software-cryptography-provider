name: Test Docker image

on:
  pull_request:
    branches: [ main*, feat/*, hotfix/* ]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}-docker-test
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # The reusable workflow declares no secrets: it builds and scans locally and pushes
  # nothing, so none are passed.
  test:
    uses: OmniTrustILM/.github/.github/workflows/containers-test.yml@main
    with:
      image: ilm/software-cryptography-provider
      cache-scope: software-cryptography-provider
      build-args: |
        VERSION=${{ github.ref_name }}
